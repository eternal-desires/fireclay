plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.name
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fireclay" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Server and client gametests: source set "gametest" (src/gametest/java, src/gametest/resources), tasks
// runGameTest and runClientGameTest. Loom makes `check` (and so `build`) depend on runGameTest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fireclay-gametest" // must match src/gametest/resources/fabric.mod.json
		enableGameTests = true
		enableClientGameTests = true
		eula = true // accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for the test runs
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
