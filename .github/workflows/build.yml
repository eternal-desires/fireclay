# Builds Fireclay and runs its server and client game tests.
name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      # runGameTest is excluded here (Loom wires it into `check`); the gametest job below runs it once.
      - run: ./gradlew build -x runGameTest --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: fireclay-jar
          path: build/libs/

  # Server gametests, kept out of the build job so a failing test does not hide the compile result or the jar.
  gametest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew runGameTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fireclay-gametest-logs
          path: build/run/gameTest/logs/
          if-no-files-found: ignore

  # Client gametest with screenshots. Like Fabric API's own CI: software rendering through Mesa
  # (llvmpipe for OpenGL, lavapipe for Vulkan); Loom wraps the client run in xvfb-run when CI is set on Linux.
  client-gametest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - run: chmod +x gradlew
      - run: ./gradlew runClientGameTest --stacktrace
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fireclay-screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fireclay-client-gametest-logs
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
